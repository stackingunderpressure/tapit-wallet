# Fleet guardrail standard — external verifier.
#
# This re-runs every gate independently of whatever a session claimed in its
# comms. It is the one verifier a loop cannot fool: it runs in a fresh checkout
# on GitHub's runner, not in the agent's sandbox. Report-only for now (it shows
# pass/fail but isn't a required check); flip it to a required status check in
# branch protection once the repo is reliably green.
name: gates

on:
  push:
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: tapit-attest integrity (one envelope standard, no drift)
        run: node tapit-attest/scripts/check-integrity.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Test-baseline tripwire
        run: npm run test:baseline
      - name: Doctrine drift-check
        run: npm run doctrine:check
