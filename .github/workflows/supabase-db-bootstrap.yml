name: Supabase DB bootstrap (one-time, run by hand)

# Run this ONCE, manually, before supabase-db-deploy.yml's first
# automatic push-to-main run. Marks every migration currently in
# supabase/migrations/ as already-applied in the tracking table
# WITHOUT running any of their SQL -- these 4 files were already
# applied to the live project before this pipeline existed. See
# scripts/supabase-migrate-bootstrap.sh's header for the full
# reasoning.
#
# Safe to re-run: marking an already-recorded version is a no-op.
# Never runs automatically (workflow_dispatch only) -- this is a
# one-time adoption step, not a normal deploy action.
#
# Same required secret/variable as supabase-db-deploy.yml (see that
# file's header for exactly what to add and where).

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify required config is present
        run: |
          missing=0
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && echo "::error::Missing secret SUPABASE_ACCESS_TOKEN" && missing=1
          [ -z "$SUPABASE_PROJECT_REF" ] && echo "::error::Missing repository variable SUPABASE_PROJECT_REF" && missing=1
          if [ "$missing" = "1" ]; then
            echo "::error::See supabase-db-deploy.yml's header comment for exactly what to add and where."
            exit 1
          fi
      - name: Mark every pre-existing migration as already applied
        run: bash scripts/supabase-migrate-bootstrap.sh
